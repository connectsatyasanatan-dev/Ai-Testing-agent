# =============================================================================
# CI — GitHub Actions (ARCHITECTURE.md §9)
#
# On every push/PR:
#   lint-python, lint-node, type-check-python, type-check-node,
#   unit, contract
#
# On main branch only:
#   integration (PostgreSQL service container), security-scan
#
# generate-types-check: enabled after P0-02 adds real schemas (if: false now)
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Shared install step ───────────────────────────────────────────────────────
# Extracted as a composite action is overkill for now; inline it in each job.

jobs:

  # ── Python lint ─────────────────────────────────────────────────────────────
  lint-python:
    name: Lint (Python / ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
      - run: pip install "ruff>=0.4,<1"
      - run: ruff check backend/packages/ backend/api/ backend/workers/ tests/

  # ── TypeScript lint ──────────────────────────────────────────────────────────
  lint-node:
    name: Lint (TypeScript / eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  # ── Python type-check ────────────────────────────────────────────────────────
  type-check-python:
    name: Type-check (Python / mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
      - name: Install packages
        run: |
          pip install --upgrade pip
          pip install -e "backend/packages/contracts[dev]"
          pip install -e "backend/packages/orchestrator[dev]"
          pip install -e "backend/packages/adapters/base[dev]"
          pip install -e "backend/packages/adapters/http_api[dev]"
          pip install -e "backend/packages/adapters/web[dev]"
          pip install -e "backend/packages/evidence[dev]"
          pip install -e "backend/packages/policy[dev]"
          pip install -e "backend/api[dev]"
          pip install -e "backend/workers/runner[dev]"
          pip install "mypy>=1.10,<2"
      - run: mypy backend/packages/ backend/api/ backend/workers/

  # ── TypeScript type-check ────────────────────────────────────────────────────
  type-check-node:
    name: Type-check (TypeScript / tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend

  # ── TypeScript tests (Vitest) ────────────────────────────────────────────────
  test-node:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  # ── TypeScript production build ──────────────────────────────────────────────
  build-node:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # ── Unit tests ───────────────────────────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
      - name: Install packages
        run: |
          pip install --upgrade pip
          pip install -e "backend/packages/contracts[dev]"
          pip install -e "backend/packages/orchestrator[dev]"
          pip install -e "backend/packages/adapters/base[dev]"
          pip install -e "backend/packages/adapters/http_api[dev]"
          pip install -e "backend/packages/adapters/web[dev]"
          pip install -e "backend/packages/evidence[dev]"
          pip install -e "backend/packages/policy[dev]"
          pip install -e "backend/api[dev]"
          pip install -e "backend/workers/runner[dev]"
          pip install "pytest>=8.2,<9" "httpx>=0.27,<1"
      - run: pytest tests/unit/ -v --tb=short

  # ── Contract tests ───────────────────────────────────────────────────────────
  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
      - name: Install packages
        run: |
          pip install --upgrade pip
          pip install -e "backend/packages/contracts[dev]"
          pip install -e "backend/packages/orchestrator[dev]"
          pip install -e "backend/packages/adapters/base[dev]"
          pip install -e "backend/packages/adapters/http_api[dev]"
          pip install -e "backend/packages/adapters/web[dev]"
          pip install -e "backend/packages/evidence[dev]"
          pip install -e "backend/packages/policy[dev]"
          pip install -e "backend/api[dev]"
          pip install -e "backend/workers/runner[dev]"
          pip install "pytest>=8.2,<9"
      - run: pytest tests/contract/ -v --tb=short

  # ── TypeScript type drift check ──────────────────────────────────────────────
  # Disabled until P0-02 produces real schemas. Remove `if: false` then.
  generate-types-check:
    name: TypeScript type drift
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install -e "backend/packages/contracts[dev]"
          pip install -e "backend/api[dev]"
      - name: Start API
        run: |
          cd backend/api
          uvicorn uitp_api.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
      - run: npm ci
        working-directory: frontend
      - run: npm run check-types-drift
        working-directory: frontend

  # ── Integration tests (main branch, needs PostgreSQL) ───────────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uitp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UITP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/uitp_test
      UITP_APP_ENV: test
      UITP_SECRET_KEY: ci-integration-test-secret-key-32chars!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install packages
        run: |
          pip install --upgrade pip
          pip install -e "backend/packages/contracts[dev]"
          pip install -e "backend/packages/orchestrator[dev]"
          pip install -e "backend/packages/adapters/base[dev]"
          pip install -e "backend/packages/adapters/http_api[dev]"
          pip install -e "backend/packages/adapters/web[dev]"
          pip install -e "backend/packages/evidence[dev]"
          pip install -e "backend/packages/policy[dev]"
          pip install -e "backend/api[dev]"
          pip install -e "backend/workers/runner[dev]"
          pip install "pytest>=8.2,<9" "httpx>=0.27,<1"
      - run: pytest tests/integration/ tests/security/ -v --tb=short

  # ── Security scan (main branch) ──────────────────────────────────────────────
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: pip install pip-audit
      - run: pip-audit --strict || true
        # Remove `|| true` once skeleton deps are replaced with real pinned versions.
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=critical
        working-directory: frontend
