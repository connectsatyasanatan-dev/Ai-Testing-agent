# =============================================================================
# Root pyproject.toml — shared Python tool config for the whole monorepo.
# Does NOT define a Python package.
# pytest testpaths points at tests/ (at repo root).
# =============================================================================

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E","W","F","I","B","C4","UP","S","N","ANN","RUF"]
ignore = ["ANN101","ANN102","S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101","ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py","*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers","--tb=short"]
asyncio_mode = "auto"
markers = [
    "unit: fast, no I/O",
    "contract: adapter conformance tests",
    "integration: requires database and infrastructure",
    "e2e: requires full stack",
    "security: security and authorization tests",
]
