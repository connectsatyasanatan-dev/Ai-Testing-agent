# =============================================================================
# backend/pyproject.toml — shared tool configuration for all Python packages.
# This file does NOT define a Python package itself.
# Individual packages have their own pyproject.toml.
# =============================================================================

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E","W","F","I","B","C4","UP","S","N","ANN","RUF"]
ignore = ["ANN101","ANN102","S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101","ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
# Tests live at the repo root under tests/
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "--tb=short"]
markers = [
    "unit: fast, no I/O",
    "contract: adapter conformance tests",
    "integration: requires database and infrastructure",
    "e2e: requires full stack",
    "security: security and authorization tests",
]
