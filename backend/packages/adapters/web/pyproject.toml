[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uitp-adapter-web"
version = "0.1.0"
description = "Playwright web adapter (Milestone 2)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "uitp-contracts>=0.1.0",
    "uitp-adapter-base>=0.1.0",
    # playwright is added in P2-01; pinned at that point.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/uitp_adapter_web"]
