[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uitp-adapter-http-api"
version = "0.1.0"
description = "HTTP API adapter (Milestone 1)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uitp-contracts>=0.1.0",
    "uitp-adapter-base>=0.1.0",
    "uitp-policy>=0.1.0",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "respx>=0.21,<1",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/uitp_adapter_http_api"]
