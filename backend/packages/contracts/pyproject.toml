[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uitp-contracts"
version = "0.1.0"
description = "Shared Pydantic schemas and type definitions for the Universal AI Testing Platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/uitp_contracts"]
