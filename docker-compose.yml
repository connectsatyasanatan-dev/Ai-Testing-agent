# =============================================================================
# universal-ai-testing-platform — Docker Compose
#
# PURPOSE: Local infrastructure dependencies and runnable services.
# - postgres: Primary application relational database.
# - redis: Redis instance for RQ job queues and distributed rate limiting.
# - api: Control plane FastAPI server.
# - worker: Hardened background RQ worker process for test executions (Task P3-07).
#
# HARDENING & ISOLATION (P3-07):
# - Non-root container process (UID 10001).
# - No-new-privileges flag prevents setuid escalation.
# - Dropped all Linux capabilities (cap_drop: ALL).
# - CPU, memory, and PID limits enforced.
# - Bounded tmpfs (/tmp, 128MB, noexec, nosuid, nodev) prevents arbitrary binary execution.
# - No host Docker socket mounts (/var/run/docker.sock is never mounted).
# - Secret keys (UITP_SECRET_KEY) are kept out of worker environment.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uitp_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 100
    tmpfs:
      - /tmp:size=64M,noexec,nosuid,nodev
    environment:
      UITP_APP_ENV: development
      UITP_SECRET_KEY: ${UITP_SECRET_KEY:-local-dev-secret-key-at-least-32-chars-long}
      UITP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/uitp_dev
      UITP_REDIS_URL: redis://redis:6379/0
      UITP_ARTIFACT_STORAGE_PATH: /app/artifacts
      UITP_BASE_URL: http://localhost:8090
    ports:
      - "8090:8000"
    volumes:
      - artifact-data:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "uitp_worker_runner.cli", "--redis-url", "redis://redis:6379/0"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
          pids: 100
    tmpfs:
      - /tmp:size=128M,noexec,nosuid,nodev
    environment:
      UITP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/uitp_dev
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/uitp_dev
      UITP_REDIS_URL: redis://redis:6379/0
      UITP_ARTIFACT_STORAGE_PATH: /app/artifacts
    volumes:
      - artifact-data:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  artifact-data:
