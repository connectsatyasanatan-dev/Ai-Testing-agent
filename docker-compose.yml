# =============================================================================
# universal-ai-testing-platform — Docker Compose
#
# PURPOSE: Local infrastructure dependencies and runnable services.
# - postgres: Primary application relational database.
# - redis: Redis instance for RQ job queues and distributed rate limiting.
# - api: Control plane FastAPI server.
# - worker: Background RQ worker process for test executions.
#
# USAGE:
#   Start infrastructure only:  docker compose up postgres redis -d
#   Start all services:         docker compose up -d
#   Stop and remove volumes:    docker compose down -v
#
# Credentials here are for LOCAL DEVELOPMENT ONLY.
# Never use these values in staging or production.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uitp_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      UITP_APP_ENV: development
      UITP_SECRET_KEY: ${UITP_SECRET_KEY:-local-dev-secret-key-at-least-32-chars-long}
      UITP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/uitp_dev
      UITP_REDIS_URL: redis://redis:6379/0
      UITP_ARTIFACT_STORAGE_PATH: /app/artifacts
      UITP_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    volumes:
      - artifact-data:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "uitp_worker_runner.cli", "--redis-url", "redis://redis:6379/0"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/uitp_dev
      UITP_REDIS_URL: redis://redis:6379/0
      UITP_ARTIFACT_STORAGE_PATH: /app/artifacts
    volumes:
      - artifact-data:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  artifact-data:
