# =============================================================================
# universal-ai-testing-platform — Docker Compose
#
# PURPOSE: Provides local infrastructure dependencies.
# - Milestone 1: PostgreSQL only (queue not needed).
# - Milestone 2: PostgreSQL + Redis.
#
# USAGE:
#   Start Milestone 1 deps:  docker compose up postgres -d
#   Start all deps:          docker compose up -d
#   Stop and remove volumes: docker compose down -v
#
# Credentials here are for LOCAL DEVELOPMENT ONLY.
# Never use these values in staging or production.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uitp_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Milestone 2 only — not required for Milestone 1.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
